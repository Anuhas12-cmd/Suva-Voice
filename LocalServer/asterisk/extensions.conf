; Suva Voice IVR dialplan
; Copy the [suva-outbound] context into Asterisk extensions.conf.
; Record the prompt text in asterisk/prompts/greeting.txt as custom/suva-greeting.

[suva-outbound]
exten => s,1,NoOp(Suva Voice ${CALL_ID})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Set(TIMEOUT(digit)=5)
 same => n,Set(TIMEOUT(response)=8)
 same => n,Playback(custom/suva-greeting)
 same => n,Read(SUVA_DIGIT,,1,,3,8)
 same => n,GotoIf($["${SUVA_DIGIT}" = ""]?noresponse,1)
 same => n,System(curl -s -X POST -H "Content-Type: application/json" -H "x-voice-secret: ${VOICE_SECRET}" -d "{\"callId\":\"${CALL_ID}\",\"event\":\"dtmf\",\"digit\":\"${SUVA_DIGIT}\"}" http://127.0.0.1:4000/api/voice/events)
 same => n,Hangup()

exten => noresponse,1,NoOp(No keypad response)
 same => n,System(curl -s -X POST -H "Content-Type: application/json" -H "x-voice-secret: ${VOICE_SECRET}" -d "{\"callId\":\"${CALL_ID}\",\"event\":\"no_response\"}" http://127.0.0.1:4000/api/voice/events)
 same => n,Hangup()

exten => failed,1,NoOp(Call failed)
 same => n,System(curl -s -X POST -H "Content-Type: application/json" -H "x-voice-secret: ${VOICE_SECRET}" -d "{\"callId\":\"${CALL_ID}\",\"event\":\"failed\"}" http://127.0.0.1:4000/api/voice/events)
 same => n,Hangup()
